---
- nodeset:
    name: xwalk-ubuntu-24.04
    nodes:
      - name: ubuntu
        label: ubuntu-24.04-xwalk-ci

- job:
    name: xwalk-shellcheck
    description: xWalk repository-owned shell script analysis.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    timeout: 300
    vars:
      xwalk_ci_job: shellcheck

- job:
    name: xwalk-styler
    description: xWalk C++ formatting, indentation, and 120-character line validation.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    vars:
      xwalk_ci_job: styler

- job:
    name: xwalk-deployment-scripts
    description: xWalk deployment script tests and provisioning validation.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    vars:
      xwalk_ci_job: deployment-scripts

- job:
    name: xwalk-build-gcc-debug
    description: xWalk GCC Debug host build, tests, and device-free diagnostic.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies:
      - xwalk-shellcheck
      - xwalk-deployment-scripts
    vars:
      xwalk_ci_job: build-and-test
      xwalk_ci_arguments: [gcc, Debug]

- job:
    name: xwalk-build-gcc-release
    description: xWalk GCC Release host build, tests, and device-free diagnostic.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies:
      - xwalk-shellcheck
      - xwalk-deployment-scripts
    vars:
      xwalk_ci_job: build-and-test
      xwalk_ci_arguments: [gcc, Release]

- job:
    name: xwalk-build-clang-debug
    description: xWalk Clang Debug host build, tests, and device-free diagnostic.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies:
      - xwalk-shellcheck
      - xwalk-deployment-scripts
    vars:
      xwalk_ci_job: build-and-test
      xwalk_ci_arguments: [clang, Debug]

- job:
    name: xwalk-build-clang-release
    description: xWalk Clang Release host build, tests, and device-free diagnostic.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies:
      - xwalk-shellcheck
      - xwalk-deployment-scripts
    vars:
      xwalk_ci_job: build-and-test
      xwalk_ci_arguments: [clang, Release]

- job:
    name: xwalk-asan-ubsan
    description: xWalk AddressSanitizer and UndefinedBehaviorSanitizer verification.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    timeout: 1200
    dependencies: &xwalk-build-dependencies
      - xwalk-build-gcc-debug
      - xwalk-build-gcc-release
      - xwalk-build-clang-debug
      - xwalk-build-clang-release
    vars:
      xwalk_ci_job: asan-ubsan

- job:
    name: xwalk-leak-sanitizer
    description: xWalk LeakSanitizer runtime verification.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    timeout: 1200
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: leak-sanitizer

- job:
    name: xwalk-thread-sanitizer
    description: xWalk ThreadSanitizer concurrency verification.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    timeout: 600
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: thread-sanitizer

- job:
    name: xwalk-host-stress
    description: xWalk repeated host stress tests.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: stress-tests

- job:
    name: xwalk-recorded-scenarios
    description: xWalk recorded vision scenario validation.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: recorded-scenarios

- job:
    name: xwalk-video-streaming
    description: xWalk loopback video streaming and backpressure tests.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: streaming

- job:
    name: xwalk-fuzz-smoke
    description: xWalk bounded host fuzz smoke tests.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    timeout: 600
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: fuzz-smoke

- job:
    name: xwalk-robot-hat-soak
    description: xWalk device-free Robot HAT soak simulation.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: soak-smoke
      xwalk_ci_artifact_paths:
        - build-host/cmake/xWalkHal/simulation/xWalkRobotHat/xwalk-robot-hat-soak-report.json

- job:
    name: xwalk-static-analysis
    description: xWalk Clang-Tidy and Cppcheck analysis.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: static-analysis

- job:
    name: xwalk-code-coverage
    description: xWalk GCC and Clang code coverage validation and reports.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: coverage
      xwalk_ci_artifact_paths:
        - build-host/coverage
        - build-host/coverage-clang

- job:
    name: xwalk-valgrind
    description: xWalk Valgrind memory and descriptor analysis.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    timeout: 1800
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: valgrind
      xwalk_ci_artifact_paths:
        - build-host/valgrind

- job:
    name: xwalk-clang-static-analyzer
    description: xWalk Clang Static Analyzer verification and reports.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    timeout: 1800
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: clang-static-analyzer
      xwalk_ci_artifact_paths:
        - build-host/clang-analyzer/reports

- job:
    name: xwalk-staged-install
    description: xWalk staged installation and device-free deployment diagnostic.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: staged-install
      xwalk_ci_artifact_paths:
        - build-host/deploy.sha256

- job:
    name: xwalk-arm64-validation
    description: xWalk ARM64 dependency audit and configured cross-build validation.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    dependencies: *xwalk-build-dependencies
    vars:
      xwalk_ci_job: arm64

- job:
    name: xwalk-code-health
    description: MyPiCarX changed-code CodeScene delta analysis and rollout policy.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    timeout: 1200
    dependencies:
      - xwalk-shellcheck
      - xwalk-deployment-scripts
    vars:
      xwalk_ci_job: codescene
      xwalk_ci_artifact_paths:
        - build-host/codescene

- job:
    name: xwalk-host-quality-gate
    description: xWalk final Host Quality dependency verification.
    nodeset: xwalk-ubuntu-24.04
    run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/run-host-quality-job.yaml
    post-run: xWalk-rpi5-tool/shell-agent/env-tool/playbooks/zuul/collect-host-quality-artifacts.yaml
    dependencies:
      - xwalk-shellcheck
      - xwalk-deployment-scripts
      - xwalk-build-gcc-debug
      - xwalk-build-gcc-release
      - xwalk-build-clang-debug
      - xwalk-build-clang-release
      - xwalk-asan-ubsan
      - xwalk-leak-sanitizer
      - xwalk-thread-sanitizer
      - xwalk-host-stress
      - xwalk-recorded-scenarios
      - xwalk-video-streaming
      - xwalk-fuzz-smoke
      - xwalk-robot-hat-soak
      - xwalk-static-analysis
      - xwalk-code-coverage
      - xwalk-valgrind
      - xwalk-clang-static-analyzer
      - xwalk-staged-install
      - xwalk-arm64-validation
      - xwalk-code-health
    vars:
      xwalk_ci_job: host-quality-gate

- project:
    check:
      jobs: &xwalk-host-quality-jobs
        - xwalk-shellcheck
        - xwalk-styler
        - xwalk-deployment-scripts
        - xwalk-build-gcc-debug
        - xwalk-build-gcc-release
        - xwalk-build-clang-debug
        - xwalk-build-clang-release
        - xwalk-asan-ubsan
        - xwalk-leak-sanitizer
        - xwalk-thread-sanitizer
        - xwalk-host-stress
        - xwalk-recorded-scenarios
        - xwalk-video-streaming
        - xwalk-fuzz-smoke
        - xwalk-robot-hat-soak
        - xwalk-static-analysis
        - xwalk-code-coverage
        - xwalk-valgrind
        - xwalk-clang-static-analyzer
        - xwalk-staged-install
        - xwalk-arm64-validation
        - xwalk-code-health
        - xwalk-host-quality-gate
    gate:
      jobs: *xwalk-host-quality-jobs
