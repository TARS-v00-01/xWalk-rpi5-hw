name: xWalk Hardware Quality
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xwalk-hardware-quality-${{ github.sha }}
  cancel-in-progress: true
jobs:
  hardware:
    name: Hardware component integration
    runs-on: [self-hosted, linux, x64, xwalk-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact hardware components in their pinned build context
        run: python3 -B ci/run-host-ci.py
      - name: Preserve module results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hardware-host-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
