name: xWalk Developer Notes Pages

on:
  push:
    branches: [master]
    paths:
      - devloper-note
      - devloper-note/**
      - scripts/integration/doc-tool/**
      - .github/workflows/developer-note-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xwalk-developer-notes-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate the integrated repository metadata
        env:
          XWALK_GITHUB_METADATA_ONLY: 'true'
        run: scripts/integration/shell-agent/gerrit-tool/checkout-gerrit-submodules.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read the enabled GitHub Pages configuration
        uses: actions/configure-pages@v6
      - name: Build the Gerrit-approved developer-note wiki
        env:
          XWALK_WIKI_GITHUB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          XWALK_WIKI_GITHUB_SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          XWALK_WIKI_GITHUB_SOURCE_REVISION: ${{ github.sha }}
        run: scripts/integration/doc-tool/wiki.sh verify --site-url "$XWALK_WIKI_GITHUB_URL"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build-devloper-note-wiki/github-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the approved documentation artifact
        id: deployment
        uses: actions/deploy-pages@v5
