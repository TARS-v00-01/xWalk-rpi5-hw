# Authoritative Raspberry Pi build, runtime-generation, and setup defaults.
XWALK_DEFAULT_RPI_PROFILE=robot_hat_v4
XWALK_DEFAULT_RPI_RUNTIME_USER=xwalk
XWALK_DEFAULT_RPI_GPIO_DEVICE=/dev/gpiochip4
XWALK_DEFAULT_RPI_I2C_DEVICE=/dev/i2c-1
XWALK_DEFAULT_RPI_SPI_DEVICE=/dev/spidev0.0
XWALK_DEFAULT_RPI_CAMERA=csi
XWALK_DEFAULT_RPI_VOICE_CAPTURE_DEVICE=plughw:CARD=Device,DEV=0
XWALK_DEFAULT_RPI_VOICE_MIXER_DEVICE=pulse
XWALK_DEFAULT_RPI_VOICE_MIXER_ELEMENT=Master
XWALK_DEFAULT_RPI_PIPER_EXECUTABLE=/opt/xwalk/piper-tts/venv/bin/piper
