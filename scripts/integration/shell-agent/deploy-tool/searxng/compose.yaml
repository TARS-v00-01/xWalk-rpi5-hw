name: xwalk-searxng

services:
  core:
    image: "docker.io/searxng/searxng:${SEARXNG_VERSION:?Set SEARXNG_VERSION to a reviewed image tag}"
    container_name: xwalk-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_BASE_URL: "http://127.0.0.1:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set a private SearXNG secret}"
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
    volumes:
      - "./settings.yml:/etc/searxng/settings.yml:ro"
      - "searxng-cache:/var/cache/searxng"

volumes:
  searxng-cache:
