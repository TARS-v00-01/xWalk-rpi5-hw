root = ../../../../..
object-directory = ../../../../../build-host/coverage
exclude = (^|.*/)(test|tests|xWalkTest|third_party|auto-gen|build-host|build-rpi)/
print-summary = yes
# Ignore only compiler-generated exception and unreachable control-flow edges.
exclude-unreachable-branches = yes
exclude-throw-branches = yes
# Ratchet the post-refactor production baseline; raise these as host tests expand.
fail-under-line = 75
fail-under-function = 85
fail-under-branch = 66
html-details = ../../../../../build-host/coverage/coverage.html
xml-pretty = yes
xml = ../../../../../build-host/coverage/coverage.xml
json-pretty = yes
json = ../../../../../build-host/coverage/coverage.json
