---
- name: Run one xWalk Host Quality job
  hosts: all
  gather_facts: false
  tasks:
    - name: Validate the repository-controlled xWalk job selection
      ansible.builtin.assert:
        that:
          - xwalk_ci_job is defined
          - xwalk_ci_job | length > 0
          - zuul.project.src_dir is defined
        fail_msg: The Zuul job did not provide a valid xWalk Host Quality selection.

    - name: Execute the repository-owned xWalk Host Quality implementation
      ansible.builtin.command:
        argv: "{{ ['bash', 'scripts/integration/shell-agent/gerrit-tool/run-host-ci-job.sh', xwalk_ci_job]
          + (xwalk_ci_arguments | default([])) }}"
        chdir: "{{ ansible_user_dir }}/{{ zuul.project.src_dir }}"
      changed_when: false
