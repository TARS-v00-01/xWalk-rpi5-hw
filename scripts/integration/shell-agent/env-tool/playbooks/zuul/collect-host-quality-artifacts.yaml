---
- name: Stage xWalk Host Quality reports for Zuul log collection
  hosts: all:!zuul_unreachable
  gather_facts: false
  vars:
    xwalk_repository_root: "{{ ansible_user_dir }}/{{ zuul.project.src_dir }}"
    xwalk_artifact_root: "{{ ansible_user_dir }}/zuul-output/artifacts/{{ zuul.job }}"
  tasks:
    - name: Inspect configured xWalk report paths
      ansible.builtin.stat:
        path: "{{ xwalk_repository_root }}/{{ item }}"
      loop: "{{ xwalk_ci_artifact_paths | default([]) }}"
      register: xwalk_artifact_stats

    - name: Create the xWalk Zuul artifact staging directory
      ansible.builtin.file:
        path: "{{ xwalk_artifact_root }}"
        state: directory
        mode: "0755"
      when: xwalk_artifact_stats.results | selectattr('stat.exists') | list | length > 0

    - name: Stage available xWalk reports for the base job fetch-output role
      ansible.builtin.copy:
        src: "{{ item.stat.path }}"
        dest: "{{ xwalk_artifact_root }}/"
        remote_src: true
        mode: preserve
      loop: "{{ xwalk_artifact_stats.results }}"
      when: item.stat.exists
